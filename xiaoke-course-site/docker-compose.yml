services:
  web:
    build: .
    container_name: xiaoke-web
    ports:
      - "8080:80"
    volumes:
      # 整个站点目录挂载进容器：install.php 生成的 config.php 直接落在宿主机，容器重建不丢失
      - .:/var/www/html
    environment:
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: xiaoke-db
    environment:
      MYSQL_ROOT_PASSWORD: xiaoke123456
      MYSQL_DATABASE: xiaoke_course
      TZ: Asia/Shanghai
    volumes:
      - xiaoke-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pxiaoke123456"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  xiaoke-mysql:
